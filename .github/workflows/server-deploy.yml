name: 服务端自动部署

on:
  push:
    branches:
      - main
    paths:
      - "server/**"
      - "compose.production.yaml"
      - "deploy/**"
      - "infra/**"
  workflow_dispatch:
    inputs:
      commit:
        description: "要部署的提交，留空表示 main"
        required: false
        default: "main"

permissions:
  contents: read

concurrency:
  group: plateview-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: 部署到七牛云生产服务器
    runs-on: ubuntu-latest
    steps:
      - name: 配置 SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/plateview_deploy"
          chmod 600 "$HOME/.ssh/plateview_deploy"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"

      - name: 执行服务器部署
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          TARGET_COMMIT: ${{ github.event.inputs.commit || github.sha }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_PORT"
          if [[ "$TARGET_COMMIT" != "main" && ! "$TARGET_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "部署目标必须是 main 或完整提交哈希"
            exit 1
          fi
          ssh_args=(-i "$HOME/.ssh/plateview_deploy" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=20 \
            -o ConnectTimeout=15 \
            -p "$DEPLOY_PORT")
          remote="$DEPLOY_USER@$DEPLOY_HOST"
          status_file="/opt/plateview/runtime/deploy-status-$TARGET_COMMIT"
          ssh "${ssh_args[@]}" "$remote" \
            "rm -f '$status_file'; nohup sh -c 'set -eu; cd /opt/plateview/source; git fetch --prune origin main; git checkout --detach --force $TARGET_COMMIT; ./deploy/plateview-deploy.sh $TARGET_COMMIT; rc=\$?; printf \"%s\\n\" \"\$rc\" > \"$status_file\"' </dev/null >/dev/null 2>&1 &"

          for attempt in $(seq 1 120); do
            state=$(ssh "${ssh_args[@]}" "$remote" "cat '$status_file' 2>/dev/null || true" || true)
            if [[ "$state" == "0" ]]; then
              echo "服务器部署成功"
              exit 0
            fi
            if [[ "$state" =~ ^[1-9][0-9]*$ ]]; then
              echo "服务器部署失败，状态码：$state"
              exit 1
            fi
            sleep 15
          done
          echo "等待服务器部署结果超时"
          exit 1
