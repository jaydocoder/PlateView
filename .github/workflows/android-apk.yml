name: Android APK 构建

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: android

jobs:
  verify-and-build-debug:
    name: 验证并构建调试 APK
    runs-on: ubuntu-latest
    steps:
      - name: 获取源码
        uses: actions/checkout@v4

      - name: 配置 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 执行单元测试、静态检查和调试构建
        run: >-
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
          -PplateviewApiBaseUrl=https://api.chenxiruyu.dpdns.org/

      - name: 上传调试 APK
        uses: actions/upload-artifact@v4
        with:
          name: plateview-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  build-and-release:
    name: 构建并发布正式 APK
    needs: verify-and-build-debug
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 获取源码
        uses: actions/checkout@v4

      - name: 配置 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 还原发布签名
        env:
          PLATEVIEW_KEYSTORE_BASE64: ${{ secrets.PLATEVIEW_KEYSTORE_BASE64 }}
          PLATEVIEW_STORE_PASSWORD: ${{ secrets.PLATEVIEW_STORE_PASSWORD }}
          PLATEVIEW_KEY_ALIAS: ${{ secrets.PLATEVIEW_KEY_ALIAS }}
          PLATEVIEW_KEY_PASSWORD: ${{ secrets.PLATEVIEW_KEY_PASSWORD }}
        run: |
          test -n "$PLATEVIEW_KEYSTORE_BASE64"
          test -n "$PLATEVIEW_STORE_PASSWORD"
          test -n "$PLATEVIEW_KEY_ALIAS"
          test -n "$PLATEVIEW_KEY_PASSWORD"
          printf '%s' "$PLATEVIEW_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/plateview-release.jks"
          {
            printf 'storeFile=%s\n' "$RUNNER_TEMP/plateview-release.jks"
            printf 'storePassword=%s\n' "$PLATEVIEW_STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$PLATEVIEW_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$PLATEVIEW_KEY_PASSWORD"
          } > keystore.properties

      - name: 构建正式 APK
        run: >-
          ./gradlew :app:assembleRelease
          -PplateviewApiBaseUrl=https://api.chenxiruyu.dpdns.org/

      - name: 上传正式 APK 工件
        uses: actions/upload-artifact@v4
        with:
          name: plateview-release-apk-${{ github.ref_name }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90

      - name: 创建 GitHub 正式发布
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: android/app/build/outputs/apk/release/app-release.apk
          overwrite_files: true

      - name: 同步 APK 镜像与更新清单到服务器
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          VERSION: ${{ github.ref_name }}
        run: |
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_PORT"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/plateview_deploy"
          chmod 600 "$HOME/.ssh/plateview_deploy"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          apk="app/build/outputs/apk/release/app-release.apk"
          sha256=$(sha256sum "$apk" | awk '{print $1}')
          remote="$DEPLOY_USER@$DEPLOY_HOST"
          ssh_args=(
            -i "$HOME/.ssh/plateview_deploy"
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
            -o ConnectTimeout=20
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=20
            -o TCPKeepAlive=yes
            -p "$DEPLOY_PORT"
          )
          remote_apk="/opt/plateview/updates/PlateView-${VERSION}.apk"
          remote_upload="${remote_apk}.upload"
          local_size=$(stat -c%s "$apk")
          ssh "${ssh_args[@]}" "$remote" "mkdir -p /opt/plateview/updates"
          for attempt in $(seq 1 3); do
            remote_size=$(ssh "${ssh_args[@]}" "$remote" "test -f '${remote_upload}' && stat -c%s '${remote_upload}' || printf 0")
            if [ "$remote_size" -gt "$local_size" ]; then
              ssh "${ssh_args[@]}" "$remote" "rm -f '${remote_upload}'"
              remote_size=0
            fi
            while [ "$remote_size" -lt "$local_size" ]; do
              chunk_size=$((4 * 1024 * 1024))
              remaining=$((local_size - remote_size))
              if [ "$remaining" -lt "$chunk_size" ]; then
                chunk_size=$remaining
              fi
              dd if="$apk" bs=4M iflag=skip_bytes,count_bytes skip="$remote_size" count="$chunk_size" status=none | \
                ssh "${ssh_args[@]}" "$remote" "cat >> '${remote_upload}'" || break
              remote_size=$((remote_size + chunk_size))
            done
            remote_size=$(ssh "${ssh_args[@]}" "$remote" "test -f '${remote_upload}' && stat -c%s '${remote_upload}' || printf 0")
            if [ "$remote_size" -eq "$local_size" ]; then
              break
            fi
          done
          test "$remote_size" -eq "$local_size"
          ssh "${ssh_args[@]}" "$remote" \
            "set -eu; test \"\$(sha256sum '${remote_upload}' | awk '{print \$1}')\" = '$sha256'; mv '${remote_upload}' '$remote_apk'; printf '{\\\"versionName\\\":\\\"%s\\\",\\\"releaseNotes\\\":\\\"\\\",\\\"apkUrl\\\":\\\"https://api.chenxiruyu.dpdns.org/updates/PlateView-%s.apk\\\",\\\"sha256\\\":\\\"%s\\\"}\\n' '$VERSION' '$VERSION' '$sha256' > /opt/plateview/updates/latest.json.next; mv /opt/plateview/updates/latest.json.next /opt/plateview/updates/latest.json; ls -1t /opt/plateview/updates/PlateView-v*.apk | tail -n +6 | xargs -r rm -f"
