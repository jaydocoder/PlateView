services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-plateview}
      POSTGRES_USER: ${POSTGRES_USER:-plateview}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在.env中设置数据库密码}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      PORT: ${API_PORT:-8080}
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-plateview}
      DATABASE_USERNAME: ${POSTGRES_USER:-plateview}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?请在.env中设置数据库密码}
      DATABASE_MIGRATE_ON_START: "true"
      JWT_SECRET: ${JWT_SECRET:?请在.env中设置JWT签名密钥}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:?请在.env中设置初始管理员密码}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-43200}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-30}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-development}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-plateview-server@local}
      WECHAT_COLLECTOR_TOKEN: ${WECHAT_COLLECTOR_TOKEN:-}
      WORK_ORDER_IMAGE_DIR: /opt/plateview/work-order-images
      PLATEVIEW_BACKUP_DIR: /opt/plateview/backups
      PLATEVIEW_RESTORE_SCRIPT: /opt/plateview/bin/plateview-restore-backup.sh
      PLATEVIEW_RESTORE_RUNTIME_DIR: /opt/plateview/restore-runtime
      WECHAT_REBUILD_AUTO_BACKUP: ${WECHAT_REBUILD_AUTO_BACKUP:-true}
    volumes:
      - ./data/work-order-images:/opt/plateview/work-order-images
      - ./data/backups:/opt/plateview/backups
      - ./data/restore-runtime:/opt/plateview/restore-runtime
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  restore-runner:
    image: postgres:17-alpine
    environment:
      DATABASE_HOST: postgres
      DATABASE_NAME: ${POSTGRES_DB:-plateview}
      DATABASE_USERNAME: ${POSTGRES_USER:-plateview}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?请在.env中设置数据库密码}
      PLATEVIEW_BACKUP_DIR: /opt/plateview/backups
      PLATEVIEW_RESTORE_RUNTIME_DIR: /opt/plateview/restore-runtime
    volumes:
      - ./data/backups:/opt/plateview/backups
      - ./data/restore-runtime:/opt/plateview/restore-runtime
      - ./deploy/plateview-restore-runner.sh:/opt/plateview/bin/runner.sh:ro
      - ./deploy/plateview-restore-backup-container.sh:/opt/plateview/bin/plateview-restore-backup.sh:ro
    entrypoint: ["/bin/sh", "/opt/plateview/bin/runner.sh"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
