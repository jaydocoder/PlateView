openapi: 3.1.0
info:
  title: PlateView API
  version: 1.0.0
  description: PlateView 车辆核验系统接口契约。
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
paths:
  /auth/login:
    post:
      summary: 账号密码登录
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功并返回会话令牌与角色。
        '401':
          $ref: '#/components/responses/InvalidCredentials'
  /auth/refresh:
    post:
      summary: 刷新登录会话
      security: []
      responses:
        '200':
          description: 刷新成功。
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /auth/logout:
    post:
      summary: 退出当前会话
      responses:
        '204':
          description: 已退出。
  /vehicles/search:
    get:
      summary: 按车牌片段模糊查询候选
      parameters:
        - name: keyword
          in: query
          required: true
          description: 归一化后至少四个有效车牌字符的片段，字母大小写不敏感。
      responses:
        '200':
          description: 最多二十条候选，仅返回车牌与车辆所属类型，按精确、前缀、包含匹配排序。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleSearchResponse'
        '400':
          $ref: '#/components/responses/SearchKeywordTooShort'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /vehicles/{vehicleId}:
    get:
      summary: 获取车辆完整核验详情
      parameters:
        - $ref: '#/components/parameters/VehicleId'
      responses:
        '200':
          description: 车辆类别、人员或单位、通行信息及其余字段。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleDetail'
        '404':
          $ref: '#/components/responses/VehicleNotFound'
  /admin/vehicles:
    get:
      summary: 管理员查询车辆档案
      parameters:
        - name: keyword
          in: query
          required: false
          schema:
            type: string
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageOffset'
      responses:
        '200':
          description: 车辆管理列表，仅返回编辑所需的摘要字段。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminVehicleList'
        '403':
          $ref: '#/components/responses/AdminRequired'
    post:
      summary: 管理员创建车辆档案
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminVehicleWriteRequest'
      responses:
        '201':
          description: 车辆已创建。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminVehicle'
        '400':
          $ref: '#/components/responses/AdminValidationFailed'
  /admin/vehicles/{vehicleId}:
    get:
      summary: 管理员获取车辆编辑资料
      parameters:
        - $ref: '#/components/parameters/VehicleId'
      responses:
        '200':
          description: 完整车辆编辑资料。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminVehicle'
        '404':
          $ref: '#/components/responses/AdminResourceNotFound'
    put:
      summary: 管理员更新车辆档案
      parameters:
        - $ref: '#/components/parameters/VehicleId'
        - $ref: '#/components/parameters/IfMatchVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminVehicleWriteRequest'
      responses:
        '200':
          description: 车辆已更新。
        '400':
          $ref: '#/components/responses/AdminValidationFailed'
        '409':
          $ref: '#/components/responses/AdminConflict'
    delete:
      summary: 管理员逻辑停用车辆
      parameters:
        - $ref: '#/components/parameters/VehicleId'
        - $ref: '#/components/parameters/IfMatchVersion'
      responses:
        '200':
          description: 车辆已停用，不再出现在普通用户查询中。
        '409':
          $ref: '#/components/responses/AdminConflict'
  /admin/users:
    get:
      summary: 管理员查询用户
      responses:
        '200':
          description: 用户列表。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserList'
        '403':
          $ref: '#/components/responses/AdminRequired'
    post:
      summary: 管理员创建用户
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserCreateRequest'
      responses:
        '201':
          description: 用户已创建。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '400':
          $ref: '#/components/responses/AdminValidationFailed'
  /admin/users/{userId}:
    put:
      summary: 管理员调整账号角色和启停状态
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/IfMatchVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserUpdateRequest'
      responses:
        '200':
          description: 账号状态已更新。
        '400':
          $ref: '#/components/responses/AdminValidationFailed'
        '409':
          $ref: '#/components/responses/AdminConflict'
  /admin/imports:
    get:
      summary: 管理员查询导入批次列表
      parameters:
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageOffset'
      responses:
        '200':
          description: 导入批次摘要列表。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminImportBatchList'
  /admin/imports/preview:
    post:
      summary: 管理员上传 Excel 并创建导入预览
      description: >-
        仅创建批次和行级预览，不修改正式车辆数据。支持村民车辆、驻景区单位、驻景区企业、干部车辆和喀纳斯旅游发展股份有限公司车辆工作表。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: xlsx 或 xls 文件，最大 10MB。
      responses:
        '201':
          description: 预览批次已创建。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatch'
        '400':
          $ref: '#/components/responses/ImportFileInvalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AdminRequired'
  /admin/imports/{batchId}:
    get:
      summary: 获取导入批次及行级摘要
      parameters:
        - $ref: '#/components/parameters/BatchId'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 200
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: 批次和分页行摘要。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatch'
        '403':
          $ref: '#/components/responses/AdminRequired'
        '404':
          $ref: '#/components/responses/ImportBatchNotFound'
  /admin/imports/{batchId}/rows/resolutions:
    post:
      summary: 管理员确认或跳过待处置导入行
      description: 异常行和重复跳过行不能改为发布；有格式告警或更新冲突的行需管理员显式确认。
      parameters:
        - $ref: '#/components/parameters/BatchId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportRowResolutionsRequest'
      responses:
        '200':
          description: 行处置已保存。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatch'
        '403':
          $ref: '#/components/responses/AdminRequired'
        '404':
          $ref: '#/components/responses/ImportBatchNotFound'
        '409':
          $ref: '#/components/responses/ImportConflict'
  /admin/imports/{batchId}/publish:
    post:
      summary: 管理员确认发布导入批次
      description: 在单个事务内创建或更新车辆及资料；任一行失败时整体回滚。
      parameters:
        - $ref: '#/components/parameters/BatchId'
      responses:
        '200':
          description: 批次已发布。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatch'
        '403':
          $ref: '#/components/responses/AdminRequired'
        '404':
          $ref: '#/components/responses/ImportBatchNotFound'
        '409':
          $ref: '#/components/responses/ImportConflict'
  /admin/imports/{batchId}/rollback:
    post:
      summary: 管理员回滚已发布导入批次
      description: >-
        删除本批次创建的车辆，并通过发布前快照还原更新记录。导入后车辆若已被后续操作修改，接口返回冲突且不做部分回滚。
      parameters:
        - $ref: '#/components/parameters/BatchId'
      responses:
        '200':
          description: 批次已安全回滚。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatch'
        '403':
          $ref: '#/components/responses/AdminRequired'
        '404':
          $ref: '#/components/responses/ImportBatchNotFound'
        '409':
          $ref: '#/components/responses/ImportConflict'
  /admin/audit:
    get:
      summary: 管理员查询操作审计
      parameters:
        - name: range
          in: query
          required: false
          description: 服务端计算的时间范围，默认最近30天。
          schema:
            type: string
            enum: [24h, 7d, 30d, all]
            default: 30d
        - name: actorId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: actionType
          in: query
          required: false
          schema:
            type: string
        - name: result
          in: query
          required: false
          description: ABNORMAL 同时匹配 FAILURE 与 DENIED。
          schema:
            type: string
            enum: [ALL, SUCCESS, ABNORMAL]
            default: ALL
        - name: keyword
          in: query
          required: false
          description: 匹配账号、操作、目标类型或目标标识。
          schema:
            type: string
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageOffset'
      responses:
        '200':
          description: 只读审计记录列表，不返回敏感业务字段。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAuditList'
        '403':
          $ref: '#/components/responses/AdminRequired'
  /health:
    get:
      summary: 服务健康检查
      security: []
      responses:
        '200':
          description: 服务已就绪。
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    BatchId:
      name: batchId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    VehicleId:
      name: vehicleId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    IfMatchVersion:
      name: If-Match-Version
      in: header
      required: true
      schema:
        type: integer
        minimum: 0
    PageLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 100
    PageOffset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
  responses:
    Unauthenticated:
      description: 未登录或会话已失效。
    InvalidCredentials:
      description: 账号或密码错误。
    AdminRequired:
      description: 当前账号不具备管理员权限。
    ImportFileInvalid:
      description: 未上传文件、格式不支持、文件超过 10MB 或无法识别表头。
    ImportBatchNotFound:
      description: 导入批次不存在。
    ImportConflict:
      description: 批次状态不允许操作、行处置无效、正式数据已变更或回滚安全校验失败。
    SearchKeywordTooShort:
      description: 车牌片段归一化后不足四个有效字符。
    VehicleNotFound:
      description: 车辆不存在或已停用。
    AdminValidationFailed:
      description: 管理员提交的字段、类别、状态或版本参数无效。
    AdminResourceNotFound:
      description: 管理员请求的车辆或账号不存在。
    AdminConflict:
      description: 车辆或账号已被其他管理员修改，或账号保留约束不允许本次操作。
  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
    AdminVehicleWriteRequest:
      type: object
      required: [plateNumber, category, status, attributes]
      properties:
        plateNumber:
          type: string
        category:
          type: string
          enum: [RESIDENT, SCENIC_UNIT, SCENIC_ENTERPRISE, CADRE, KANAS_TOURISM_DEVELOPMENT]
        vehicleType:
          type: [string, 'null']
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
        attributes:
          type: object
          additionalProperties:
            type: string
        residentProfile:
          oneOf:
            - $ref: '#/components/schemas/ResidentVehicleProfile'
            - type: 'null'
        longTermProfile:
          oneOf:
            - $ref: '#/components/schemas/LongTermVehicleProfile'
            - type: 'null'
    AdminVehicle:
      allOf:
        - $ref: '#/components/schemas/AdminVehicleWriteRequest'
        - type: object
          required: [id, normalizedPlate, categoryLabel, version]
          properties:
            id:
              type: integer
              format: int64
            normalizedPlate:
              type: string
            categoryLabel:
              type: string
            version:
              type: integer
    AdminVehicleList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            type: object
            required: [id, plateNumber, category, categoryLabel, status, version]
            properties:
              id:
                type: integer
                format: int64
              plateNumber:
                type: string
              category:
                type: string
              categoryLabel:
                type: string
              status:
                type: string
              version:
                type: integer
              vehicleType:
                type: [string, 'null']
    AdminUserUpdateRequest:
      type: object
      required: [role, status]
      properties:
        role:
          type: string
          enum: [ADMIN, USER]
        status:
          type: string
          enum: [ACTIVE, DISABLED]
    AdminUserCreateRequest:
      type: object
      required: [username, password, role]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 64
        password:
          type: string
          format: password
          minLength: 6
          maxLength: 128
        role:
          type: string
          enum: [ADMIN, USER]
    AdminUser:
      allOf:
        - $ref: '#/components/schemas/AdminUserUpdateRequest'
        - type: object
          required: [id, username, version]
          properties:
            id:
              type: integer
              format: int64
            username:
              type: string
            version:
              type: integer
            createdAt:
              type: [string, 'null']
              format: date-time
            updatedAt:
              type: [string, 'null']
              format: date-time
    AdminUserList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminUser'
    AdminImportBatchList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [id, sourceFileName, status, totalRows, validRows, duplicateRows, errorRows, version]
            properties:
              id:
                type: integer
                format: int64
              sourceFileName:
                type: string
              status:
                type: string
              totalRows:
                type: integer
              validRows:
                type: integer
              duplicateRows:
                type: integer
              errorRows:
                type: integer
              version:
                type: integer
    AdminAuditList:
      type: object
      required: [items, total, summary, actors, actionTypes]
      properties:
        items:
          type: array
          items:
            type: object
            required: [id, actionType, targetType, resultStatus, createdAt]
            properties:
              id:
                type: integer
                format: int64
              actorUsername:
                type: [string, 'null']
              actionType:
                type: string
              targetType:
                type: string
              targetId:
                type: [integer, 'null']
                format: int64
              resultStatus:
                type: string
              createdAt:
                type: string
                format: date-time
        total:
          type: integer
        summary:
          type: object
          required: [total, successCount, abnormalCount, activeActorCount]
          properties:
            total:
              type: integer
            successCount:
              type: integer
            abnormalCount:
              type: integer
            activeActorCount:
              type: integer
        actors:
          type: array
          items:
            type: object
            required: [id]
            properties:
              id:
                type: integer
                format: int64
              username:
                type: [string, 'null']
        actionTypes:
          type: array
          items:
            type: string
    ImportBatch:
      type: object
      required: [id, sourceFileName, status, stats, rows]
      properties:
        id:
          type: integer
          format: int64
        sourceFileName:
          type: string
        status:
          type: string
          enum: [VALIDATED, PUBLISHED, ROLLED_BACK]
        stats:
          $ref: '#/components/schemas/ImportBatchStats'
        createdAt:
          type: [string, 'null']
          format: date-time
        publishedAt:
          type: [string, 'null']
          format: date-time
        rollbackAt:
          type: [string, 'null']
          format: date-time
        rows:
          type: array
          items:
            $ref: '#/components/schemas/ImportRow'
    ImportBatchStats:
      type: object
      required: [totalRows, newRows, updateRows, duplicateRows, errorRows, warningRows, publishableRows, pendingReviewRows]
      properties:
        totalRows:
          type: integer
        newRows:
          type: integer
        updateRows:
          type: integer
        duplicateRows:
          type: integer
        errorRows:
          type: integer
        warningRows:
          type: integer
        publishableRows:
          type: integer
        pendingReviewRows:
          type: integer
    ImportRow:
      type: object
      required: [id, sourceSheetName, sourceRowNumber, sourceItemIndex, resultStatus, plannedAction, resolution]
      properties:
        id:
          type: integer
          format: int64
        sourceSheetName:
          type: string
        sourceRowNumber:
          type: integer
        sourceItemIndex:
          type: integer
        plateNumber:
          type: [string, 'null']
        normalizedPlate:
          type: [string, 'null']
        category:
          type: [string, 'null']
          enum: [RESIDENT, SCENIC_UNIT, SCENIC_ENTERPRISE, CADRE, KANAS_TOURISM_DEVELOPMENT, null]
        primarySubject:
          type: [string, 'null']
          description: 村民姓名或长期车辆单位名称，不返回身份证号和联系方式。
        resultStatus:
          type: string
          enum: [VALID, DUPLICATE, ERROR, PUBLISHED]
        plannedAction:
          type: string
          enum: [CREATE, UPDATE, SKIP, NONE]
        resolution:
          type: string
          enum: [PENDING, PUBLISH, SKIP, ERROR]
        errorMessage:
          type: [string, 'null']
        warningMessage:
          type: [string, 'null']
    ImportRowResolutionsRequest:
      type: object
      required: [rows]
      properties:
        rows:
          type: array
          minItems: 1
          items:
            type: object
            required: [rowId, resolution]
            properties:
              rowId:
                type: integer
                format: int64
              resolution:
                type: string
                enum: [PUBLISH, SKIP]
    VehicleSearchResponse:
      type: object
      required: [candidates]
      properties:
        candidates:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/VehicleSearchCandidate'
    VehicleSearchCandidate:
      type: object
      required: [id, plateNumber, category, categoryLabel]
      properties:
        id:
          type: integer
          format: int64
        plateNumber:
          type: string
        category:
          type: string
          enum: [RESIDENT, SCENIC_UNIT, SCENIC_ENTERPRISE, CADRE, KANAS_TOURISM_DEVELOPMENT]
        categoryLabel:
          type: string
          description: 车辆所属类型的中文名称。
    VehicleDetail:
      type: object
      required: [id, plateNumber, normalizedPlate, category, categoryLabel, attributes]
      properties:
        id:
          type: integer
          format: int64
        plateNumber:
          type: string
        normalizedPlate:
          type: string
        category:
          type: string
          enum: [RESIDENT, SCENIC_UNIT, SCENIC_ENTERPRISE, CADRE, KANAS_TOURISM_DEVELOPMENT]
        categoryLabel:
          type: string
        vehicleType:
          type: [string, 'null']
        attributes:
          type: object
          additionalProperties: true
        residentProfile:
          oneOf:
            - $ref: '#/components/schemas/ResidentVehicleProfile'
            - type: 'null'
        longTermProfile:
          oneOf:
            - $ref: '#/components/schemas/LongTermVehicleProfile'
            - type: 'null'
    ResidentVehicleProfile:
      type: object
      required: [ownerName, identityCardNumber]
      properties:
        ownerName:
          type: string
        identityCardNumber:
          type: string
        contactPhone:
          type: [string, 'null']
        remarks:
          type: [string, 'null']
    LongTermVehicleProfile:
      type: object
      properties:
        organizationName:
          type: [string, 'null']
        passHolder:
          type: [string, 'null']
        passageDetails:
          type: [string, 'null']
        remarks:
          type: [string, 'null']
