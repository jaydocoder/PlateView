name: plateview

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:15432:5432"
    privileged: true
    security_opt:
      - label=disable
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-plateview}
      POSTGRES_USER: ${POSTGRES_USER:-plateview}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在生产.env中设置数据库密码}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data:Z
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro,Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  caddy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./source/deploy/Caddyfile:/etc/caddy/Caddyfile:ro,Z
      - ./runtime:/etc/caddy/runtime:ro,Z
      - ./data/caddy:/data:Z
      - ./data/caddy-config:/config:Z
      - ./updates:/srv/updates:ro,Z
    networks:
      - backend
      - edge

networks:
  backend:
    internal: true
  edge:
