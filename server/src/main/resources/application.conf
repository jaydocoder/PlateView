ktor {
  deployment {
    port = ${?PORT}
    port = 8080
  }
  application {
    modules = [ com.jaydocoder.plateview.server.ApplicationKt.module ]
  }
}

database {
  jdbcUrl = ${?DATABASE_URL}
  username = ${?DATABASE_USERNAME}
  password = ${?DATABASE_PASSWORD}
  migrateOnStart = ${?DATABASE_MIGRATE_ON_START}
  migrateOnStart = true
}

auth {
  jwtSecret = ${?JWT_SECRET}
  initialAdminPassword = ${?INITIAL_ADMIN_PASSWORD}
  accessTokenMinutes = ${?ACCESS_TOKEN_MINUTES}
  accessTokenMinutes = 43200
  refreshTokenDays = ${?REFRESH_TOKEN_DAYS}
  refreshTokenDays = 30
}

cache {
  redisUrl = ${?REDIS_URL}
}
